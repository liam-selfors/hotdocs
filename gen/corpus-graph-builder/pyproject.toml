[project]
name = "corpus-graph-builder"
version = "0.1.0"
description = "Builds verification/corpus-graph.json from the corpus graph, provenance, and verification state."
requires-python = ">=3.10"
dependencies = [
    "duckdb>=0.10",
    # Required transitively: graph-query-engine's component_provenance view
    # auto-detects a provenance manifest's generated_at field as
    # TIMESTAMP WITH TIME ZONE, and DuckDB needs pytz to materialize that
    # type (R-GQE-005, D45) -- not needed by this component's own code.
    "pytz",
]

[project.scripts]
hotdocs-corpus-graph = "corpus_graph_builder.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
